<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talha Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins', sans-serif;
}

body{
background:#0a0a0a;
color:white;
overflow:hidden;
}

/* Animated background */
.bg{
position:absolute;
width:100%;
height:100%;
background: radial-gradient(circle at 20% 20%, #00f7ff33, transparent),
            radial-gradient(circle at 80% 80%, #7c3aed33, transparent);
animation:moveBg 6s infinite alternate;
}

@keyframes moveBg{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

.container{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

h1{
font-size:60px;
animation:fade 2s ease;
}

p{
color:#bbb;
margin-top:10px;
animation:fade 3s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.buttons{
margin-top:40px;
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

.btn{
padding:15px 30px;
border:none;
border-radius:50px;
font-size:16px;
cursor:pointer;
transition:0.3s;
text-decoration:none;
font-weight:600;
}

.mail{
background:#00f7ff;
color:#000;
}

.whatsapp{
background:#25D366;
color:#000;
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 20px rgba(255,255,255,0.2);
}

.card{
margin-top:40px;
padding:20px;
border:1px solid #333;
border-radius:15px;
background:#111;
animation:fade 4s ease;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="container">

<h1>Talha Ahmad</h1>
<p>Walmart Store Specialist | SEO | PPC | Listing Expert</p>

<div class="buttons">

<!-- Email Button -->
<a class="btn mail" href="mailto:talhaahmadhere16@gmail.com">
📧 Send Email
</a>

<!-- WhatsApp Button -->
<a class="btn whatsapp" href="https://wa.me/923240630515" target="_blank">
💬 WhatsApp Me
</a>

</div>

<div class="card">
<p>
Welcome to my portfolio website.  
Contact me directly using email or WhatsApp buttons above.
</p>
</div>

</div>

</body>
</html>
